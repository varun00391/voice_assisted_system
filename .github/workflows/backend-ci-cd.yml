name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest -q

  deploy:
    name: Build image and deploy to Azure Container Apps
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP: ${{ vars.CONTAINER_APP_NAME }}
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/voice-assistant-backend:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.IMAGE }}
          build-args: WHISPER_PRELOAD_MODEL=${{ vars.WHISPER_MODEL || 'small' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --set-env-vars "APP_VERSION=$GITHUB_SHA" \
            --output none

      - name: Wait until the new revision serves /health
        run: |
          fqdn=$(az containerapp show --name "$CONTAINER_APP" --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          # Scale-from-zero plus the first image pull can take a few minutes.
          for attempt in $(seq 1 40); do
            version=$(curl -fsS --max-time 30 "https://$fqdn/health" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("version", ""))' || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "Revision $GITHUB_SHA is live at https://$fqdn"
              exit 0
            fi
            echo "Attempt $attempt: serving version '${version:-none}', waiting..."
            sleep 15
          done
          echo "::error::The new revision did not become healthy. Check the Container App's revisions and logs."
          exit 1
